---
# yamllint disable rule:line-length
name: markdown-lint
'on':
  push:
    branches:
      - master
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
      - '!paper/**'
      - '!sandbox/**'
permissions:
  contents: read
concurrency:
  group: markdown-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  markdown-lint:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34
