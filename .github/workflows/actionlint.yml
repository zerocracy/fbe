---
# yamllint disable rule:line-length
name: actionlint
'on':
  push:
    branches:
      - master
    paths:
      - '.github/**'
  pull_request:
    branches:
      - master
    paths:
      - '.github/**'
permissions:
  contents: read
jobs:
  actionlint:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4
